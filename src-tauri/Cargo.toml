[package]
name = "diffity-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
default-run = "diffity-desktop"

[lib]
name = "diffity_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "diffity-desktop"
path = "src/main.rs"
required-features = ["app"]

# Not in `default`: the Tauri CLI bundles every enabled bin, but diffity-mcp ships as the
# `externalBin` sidecar built by scripts/prepare-mcp.mjs. Build/test it with `--features mcp`.
[[bin]]
name = "diffity-mcp"
path = "src/bin/diffity-mcp/main.rs"
required-features = ["mcp"]

# The `diffity` command, bundled as an `externalBin` sidecar like diffity-mcp. Build/test it with `--features cli`.
[[bin]]
name = "diffity-cli"
path = "src/bin/diffity-cli/main.rs"
required-features = ["cli"]

[[test]]
name = "bridge_round_trip"
required-features = ["app", "mcp"]

[features]
default = ["app"]
# The Tauri app. scripts/prepare-mcp.mjs builds the sidecar with `--no-default-features
# --features mcp`, so it does not compile Tauri and the rest of the app.
app = [
  "dep:tauri-build",
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-opener",
  "dep:tauri-plugin-window-state",
  "dep:tauri-plugin-single-instance",
  "dep:tauri-plugin-updater",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-system-fonts",
  "dep:thiserror",
  "dep:uuid",
  "dep:chrono",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:rusqlite",
  "dep:notify",
  "dep:ignore",
  "dep:regex",
  "dep:base64",
  "dep:sha2",
  "dep:agent-client-protocol",
  "dep:reqwest",
  "dep:keyring",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-core-foundation",
  "dep:objc2-foundation",
  "dep:tauri-plugin-deep-link",
  "dep:tauri-plugin-notification",
]
mcp = ["dep:rmcp"]
# The `diffity` command-line tool (src/bin/diffity-cli); std only.
cli = []

[build-dependencies]
tauri-build = { version = "2.7.0", features = [], optional = true }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
anyhow = "1.0.104"
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"], optional = true }
thiserror = { version = "2.0.21", optional = true }
uuid = { version = "1.26.1", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
notify = { version = "8.2.0", optional = true }
ignore = { version = "0.4.33", optional = true }
regex = { version = "1.13.1", optional = true }
base64 = { version = "0.22.1", optional = true }
sha2 = { version = "0.10.9", optional = true }
agent-client-protocol = { version = "2.2.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
keyring = { version = "3", features = ["apple-native"], optional = true }
tauri = { version = "2.12.0", features = [], optional = true }
tauri-plugin-dialog = { version = "2.8.0", optional = true }
tauri-plugin-opener = { version = "2.6.0", optional = true }
tauri-plugin-window-state = { version = "2.5.0", optional = true }
tauri-plugin-single-instance = { version = "2.5.0", optional = true }
tauri-plugin-updater = { version = "2.13.0", optional = true }
tauri-plugin-process = { version = "2.4.0", optional = true }
tauri-plugin-system-fonts = { version = "2.0.2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-notification = { version = "2.5.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6.4", optional = true }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow", "NSButton", "NSControl", "std"], optional = true }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["CFRunLoop", "std"], optional = true }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSNotification", "NSString", "std"], optional = true }

[dev-dependencies]
tempfile = "3.27.0"
