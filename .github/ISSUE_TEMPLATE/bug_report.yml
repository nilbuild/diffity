name: Bug report
description: Something in Diffity is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a repo
        2. Click …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Diffity version
      description: Settings → About, or Diffity → About Diffity.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: OS version
      description: macOS version, or Linux distribution.
      placeholder: "15.5"
    validations:
      required: true
  - type: input
    id: arch
    attributes:
      label: Chip
      description: Apple Silicon or Intel, or the CPU architecture on Linux.
      placeholder: Apple Silicon
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste error messages or drag in screenshots and recordings.
