name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Typecheck, test, build (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C packages/parser typecheck

      - run: pnpm -C apps/desktop typecheck

      - run: pnpm test

      - run: pnpm -C apps/desktop build

  rust:
    name: Test and lint (Rust)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # build.rs writes a placeholder sidecar when diffity-mcp is not built,
      # so plain cargo works without the pnpm/Tauri CLI toolchain.
      - run: cargo test --workspace

      - run: cargo clippy --workspace --all-targets -- -D warnings
