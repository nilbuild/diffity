name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Typecheck, test, build (frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  rust:
    name: Test and lint (Rust)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # build.rs writes placeholder sidecars when diffity-mcp/diffity-cli are not built,
      # so plain cargo works without the pnpm/Tauri CLI toolchain.
      # `mcp` and `cli` (the sidecar bins) are not default features.
      - run: cargo test --all-features
        working-directory: src-tauri

      - run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: src-tauri

      # How scripts/prepare-mcp.mjs builds the sidecars: without the app.
      - run: cargo clippy --no-default-features --features mcp,cli --bin diffity-mcp --bin diffity-cli -- -D warnings
        working-directory: src-tauri

  rust-linux:
    name: Test and lint (Rust, Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: linux

      - run: cargo test --all-features
        working-directory: src-tauri

      - run: cargo clippy --all-features --all-targets -- -D warnings
        working-directory: src-tauri
